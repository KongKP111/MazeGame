<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- muhahahah -->
  <title>Python Maze Ball Game</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f9fafe; margin:0; }
    .container { max-width: 670px; margin: 38px auto; background: #fff; border-radius: 18px; padding: 32px 30px; box-shadow: 0 2px 16px #0001; }
    h2 { margin-top:0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 46px);
      gap: 2.5px;
      margin: 1.3em 0 1em 0;
      background: #e9f4fa;
      border-radius: 10px;
      padding: 7px 0 7px 7px;
    }
    .cell {
      width: 46px; height: 46px;
      border-radius: 8px;
      background: #e9f4fa;
      border: 1.3px solid #cce;
      position: relative;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1em;
      color: #2b445a;
      font-weight: 700;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .cell.t { border-top: 4px solid #98b7c8; }
    .cell.b { border-bottom: 4px solid #98b7c8; }
    .cell.l { border-left: 4px solid #98b7c8; }
    .cell.r { border-right: 4px solid #98b7c8; }
    .cell.start { background: #c0f2cf; }
    .cell.goal { background: #ffedaf; }
    .ball {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      font-size: 1.7em;
      display: flex; align-items: center; justify-content: center;
      z-index: 3;
      transition: left 0.22s linear, top 0.22s linear;
      pointer-events: none;
      flex-direction: column;
    }
    .dir-arrow {
      font-size: 1.2em;
      line-height: 1.1em;
      margin-top: -4px;
    }
    #output { margin: 0.7em 0 0.5em 0; color: #247bb7; min-height: 1.4em; font-weight: 500;}
    button { padding: 0.38em 1.6em; margin: 0 10px 0 0; border-radius: 7px; border: none; background: #46aaff; color: #fff; font-weight: bold; font-family: 'DM Sans', sans-serif; font-size: 1em; letter-spacing: 0.5px; box-shadow: 0 1px 4px #0002; cursor: pointer; transition: background 0.15s;}
    button:active { background: #1976d2; }
    #editor { margin-bottom: 12px; }
    @media (max-width: 850px) {
      .container { padding: 12px 2vw;}
      .grid { grid-template-columns: repeat(7, 11vw);}
      .cell { width: 11vw; height: 11vw;}
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Python Maze Ball Game</h2>
    <div id="objective"><strong>Objective:</strong> Find the <b>🏁</b>! Use <code>walk()</code>, <code>turn('left')</code>, <code>turn('right')</code>.</div>
    <div class="grid" id="map"></div>
    <div id="editor"></div>
    <button id="runBtn" onclick="runCode()">Run</button>
    <span id="output"></span>
  </div>

  <!-- CodeMirror 5 Classic -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script>
    // 7x7 Maze Grid - use "l", "r", "t", "b" combos for walls
    let grid = [
      ["tr",  "t",  "t",  "tr", "t",  "t",  "tr"],
      ["l",   "",   "",   "rb", "lb", "",   "rb"],
      ["lb",  "t",  "b",  "tb", "t",  "",   "rb"],
      ["lb",  "",   "l",  "",   "br", "",   "rb"],
      ["l",   "r",  "b",  "tl", "",   "t",  "br"],
      ["lb",  "",   "rb", "",   "lb", "r",  "rb"],
      ["lb",  "",   "lb", "r",  "l",  "",   "br"]  // row 6
    ];
    // Start: (1,1), Goal: (6,6)
    const START = {row: 1, col: 1, dir: "right"};
    const GOAL = {row: 6, col: 6};
    let player = {...START};
    let animating = false;

    // Directions for relative turning
    const DIRS = ["up", "right", "down", "left"];
    const DIR_EMOJI = {
      "right": "→",
      "left": "←",
      "up": "↑",
      "down": "↓"
    };

    function drawMap(dir = START.dir) {
      const mapDiv = document.getElementById("map");
      mapDiv.innerHTML = "";
      for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[0].length; c++) {
          let cell = document.createElement("div");
          let walls = grid[r][c];
          cell.className = "cell";
          if (walls.includes("t")) cell.classList.add("t");
          if (walls.includes("b")) cell.classList.add("b");
          if (walls.includes("l")) cell.classList.add("l");
          if (walls.includes("r")) cell.classList.add("r");
          if (r === START.row && c === START.col) cell.classList.add("start");
          if (r === GOAL.row && c === GOAL.col) cell.classList.add("goal");
          cell.dataset.row = r;
          cell.dataset.col = c;
          // Show wall code in box (for asset designers)
          cell.textContent = walls ? walls : "";
          mapDiv.appendChild(cell);
        }
      }
      placeBall(player.row, player.col, dir);
    }

    function placeBall(row, col, dir = START.dir) {
      // Remove any existing ball
      let oldBall = document.querySelector('.ball');
      if (oldBall) oldBall.remove();
      // Place new ball
      const mapDiv = document.getElementById("map");
      let cellIndex = row * grid[0].length + col;
      let cell = mapDiv.children[cellIndex];
      if (!cell) return;
      let ball = document.createElement("div");
      ball.className = "ball";
      ball.innerHTML = `<span>🟡</span><span class="dir-arrow">${DIR_EMOJI[dir]}</span>`;
      cell.appendChild(ball);
    }

    function canMove(row, col, dir) {
      let current = grid[row][col];
      let nextR = row, nextC = col;
      if (dir === "right") nextC++;
      if (dir === "left") nextC--;
      if (dir === "up") nextR--;
      if (dir === "down") nextR++;
      // Check bounds
      if (nextR < 0 || nextR >= grid.length || nextC < 0 || nextC >= grid[0].length) return false;
      let next = grid[nextR][nextC];
      // For each direction, check both sides
      if (dir === "right" && (current.includes("r") || next.includes("l"))) return false;
      if (dir === "left" && (current.includes("l") || next.includes("r"))) return false;
      if (dir === "up" && (current.includes("t") || next.includes("b"))) return false;
      if (dir === "down" && (current.includes("b") || next.includes("t"))) return false;
      return true;
    }

    function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

    // Parses walk/turn code into movement instructions (relative turns only)
    function parseCommands(input) {
      let lines = input.trim().split(/\n|;/).map(line => line.trim()).filter(line => line.length);
      let commands = [];
      for (let line of lines) {
        if (line.startsWith("walk(")) {
          let steps = parseInt(line.match(/walk\((\d+)\)/)?.[1]);
          if (!steps) return {msg: "Invalid walk() command!", error:true};
          for (let i = 0; i < steps; i++) commands.push({cmd:"walk"});
        } else if (line.startsWith("turn(")) {
          let dir = line.match(/turn\(['"](\w+)['"]\)/)?.[1];
          if (!["right","left"].includes(dir)) return {msg: "turn() must be 'left' or 'right' only!", error:true};
          commands.push({cmd:"turn", dir});
        } else {
          return {msg: "Unknown command: " + line, error:true};
        }
      }
      return {commands};
    }

    function turnRelative(currentDir, turnDir) {
      let idx = DIRS.indexOf(currentDir);
      if (idx === -1) idx = 1; // Default to "right"
      if (turnDir === "left") {
        idx = (idx + 3) % 4;
      } else if (turnDir === "right") {
        idx = (idx + 1) % 4;
      }
      return DIRS[idx];
    }

    async function animateMoves(commands) {
      animating = true;
      let state = {...START};
      placeBall(state.row, state.col, state.dir);
      for (let i = 0; i < commands.length; i++) {
        let cmd = commands[i];
        if (cmd.cmd === "turn") {
          state.dir = turnRelative(state.dir, cmd.dir);
          placeBall(state.row, state.col, state.dir);
          await sleep(120);
        } else if (cmd.cmd === "walk") {
          if (!canMove(state.row, state.col, state.dir)) {
            document.getElementById("output").textContent = "❌ Oops! Hit a wall. Try again.";
            document.getElementById("output").style.color = "#e02424";
            animating = false;
            return;
          }
          // move
          if (state.dir === "right") state.col++;
          if (state.dir === "left") state.col--;
          if (state.dir === "up") state.row--;
          if (state.dir === "down") state.row++;
          await sleep(230);
          placeBall(state.row, state.col, state.dir);
          // Reached goal?
          if (state.row === GOAL.row && state.col === GOAL.col) {
            document.getElementById("output").textContent = "🎉 You reached the goal! Well done!";
            document.getElementById("output").style.color = "green";
            animating = false;
            return;
          }
        }
      }
      // If not at goal, keep trying
      if (state.row !== GOAL.row || state.col !== GOAL.col) {
        document.getElementById("output").textContent = "🔎 Still in the maze! Use walk() and turn() to reach the goal.";
        document.getElementById("output").style.color = "#247bb7";
      }
      animating = false;
    }

    // Default editor code (relative turns)
    let startCode = `walk(2)
turn('right')
walk(1)
turn('left')
walk(2)
turn('right')
walk(2)
turn('right')
walk(3)`;

    let editorView = CodeMirror(document.getElementById("editor"), {
      value: startCode,
      mode: "python",
      lineNumbers: true,
      theme: "default",
      viewportMargin: Infinity,
      indentUnit: 4,
      tabSize: 4
    });

    window.runCode = async function() {
      if (animating) return; // Prevent double runs
      document.getElementById("output").textContent = "";
      player = {...START};
      drawMap();
      let code = editorView.getValue();
      let result = parseCommands(code);
      if (result.error) {
        document.getElementById("output").textContent = result.msg;
        document.getElementById("output").style.color = "#e02424";
        return;
      }
      await animateMoves(result.commands);
    }

    // Initial render
    drawMap();
  </script>
</body>
</html>
