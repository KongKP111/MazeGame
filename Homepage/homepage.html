<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Python Maze Ball Game - Homepage</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #FF6B6B, #4ECDC4, #45B7D1, #96CEB4, #FFEAA7);
      background-size: 200% 100%;
      animation: gradientMove 3s ease-in-out infinite;
    }
    @keyframes gradientMove {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    h2 {
      margin: 0 0 30px 0;
      font-size: 2.5em;
      font-weight: 700;
      background: linear-gradient(135deg, #667EEA, #764BA2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    h3 {
      margin: 40px 0 20px 0;
      font-size: 1.8em;
      font-weight: 600;
      color: #333;
      text-align: center;
    }
    #character-selection {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    #level-selection {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .character-button, .level-button {
      padding: 20px;
      background: linear-gradient(135deg, #667EEA, #764BA2);
      color: white;
      font-weight: 600;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      transition: transform 0.2s;
    }
    .character-button:hover, .level-button:hover {
      transform: scale(1.05);
    }
    .character-button.selected {
      background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }
    #character-preview {
      text-align: center;
      margin-bottom: 40px;
    }
    #character-preview img {
      width: 200px;
      height: auto;
      border: 2px solid #667EEA;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    #character-preview img.capybara {
      width: 250px; /* Larger size for capybara in preview */
    }
    .character-button img {
      width: 100%;
      height: auto;
      display: block;
    }
    .character-button img.capybara {
      width: 120%; /* Slightly larger in selection */
      position: relative;
      left: -10%;
    }
    .character-button img, #character-preview img {
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>:video_game: Python Maze Ball Game</h2>
    <h3>Select Your Character</h3>
    <div id="character-selection">
      <!-- Generated by JS -->
    </div>
    <div id="character-preview">
      <h3>Selected Character Preview</h3>
      <img id="preview-img" src="" alt="Preview" style="display: none;">
    </div>
    <h3>Select Level</h3>
    <div id="level-selection">
      <!-- Generated by JS -->
    </div>
  </div>
  <script>
    let selectedCharacter = null;
    function initCharacterSelection() {
      const selectionDiv = document.getElementById('character-selection');
      const previewImg = document.getElementById('preview-img');
      const characters = [
        { id: 1, name: 'little Red', file: '/assets/pixil-gif-drawing-unscreen.gif'},
        { id: 2, name: 'Mifu', file: '/assets/New-MIFU-drawing-unscreen.gif' },
        { id: 3, name: 'capybara', file: '/assets/NEW-CAPYBARA-drawing-unscreen.gif' },
        { id: 4, name: 'Cat', file: '/assets/Cat-drawing-unscreen.gif' }
      ];
      characters.forEach(char => {
        const button = document.createElement('div');
        button.className = 'character-button';
        const img = document.createElement('img');
        img.src = char.file;
        img.alt = char.name;
        if (char.file === '/assets/NEW-CAPYBARA-drawing-unscreen.gif') {
          img.classList.add('capybara');
        }
        button.appendChild(img);
        button.onclick = () => {
          document.querySelectorAll('.character-button').forEach(btn => btn.classList.remove('selected'));
          button.classList.add('selected');
          selectedCharacter = char.file;
          previewImg.src = char.file;
          previewImg.style.display = 'block';
          if (char.file === '/assets/NEW-CAPYBARA-drawing-unscreen.gif') {
            previewImg.classList.add('capybara');
          } else {
            previewImg.classList.remove('capybara');
          }
        };
        selectionDiv.appendChild(button);
      });
    }
    function initLevelSelection() {
      const selectionDiv = document.getElementById('level-selection');
      for (let i = 1; i <= 15; i++) {
        const button = document.createElement('div');
        button.className = 'level-button';
        button.textContent = `Level ${i}`;
        button.onclick = () => {
          if (!selectedCharacter) {
            alert('Please select a character first!');
            return;
          }
          window.location.href = `../Mainpage/mainpage.html?level=${i}&character=${encodeURIComponent(selectedCharacter)}`;
        };
        selectionDiv.appendChild(button);
      }
    }
    initCharacterSelection();
    initLevelSelection();
  </script>
</body>
</html>
